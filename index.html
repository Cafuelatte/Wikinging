<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アモアス役職Wiki</title>
    <style>
        :root {
            --bg: #000000;
            --card: #050505;
            --text: #ffffff;
            --sub: #dddddd;
            --muted: #888888;
            --line: #222222;
            --title-h: 52px;
            --bar-h: 48px;
            --header-h: calc(var(--title-h) + var(--bar-h) + 2px);
        }

        * { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--header-h) + 10px);
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- 常に最上部に固定されるヘッダー（タイトル＋タブ） --- */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #000000;
            border-bottom: 2px solid var(--line);
        }

        .title {
            margin: 0;
            height: var(--title-h);
            padding: 0 20px;
            display: flex;
            align-items: center;
            font-size: 20px;
        }

        .tabs {
            display: flex;
            height: var(--bar-h);
            border-top: 2px solid var(--line);
        }
        .tabs a {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .tabs a:hover { background: #111111; color: var(--text); }
        .tabs a:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }

        /* --- 本文 --- */
        main {
            padding: 20px;
        }

        /* --- 役職カード --- */
        .role {
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            background: var(--card);
            border: 2px solid var(--c);
            scroll-margin-top: calc(var(--header-h) + 10px);
        }

        .role summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            color: var(--c);
            cursor: pointer;
            list-style: none;
        }
        .role summary::-webkit-details-marker { display: none; }
        .role summary:hover { background: #111111; }
        .role summary:focus-visible { outline: 2px solid var(--c); outline-offset: -2px; }

        .arrow { transition: transform 0.2s ease; }
        .role[open] .arrow { transform: rotate(180deg); }

        .role-content {
            padding: 0 20px 20px;
        }

        .role-image {
            margin-bottom: 15px;
            border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
            border-radius: 8px;
            overflow: hidden;
        }
        .role-image img {
            display: block;
            width: 100%;
            max-height: 180px;
            object-fit: contain;
        }

        .role-description {
            font-size: 14px;
            line-height: 1.6;
            color: var(--sub);
            white-space: pre-wrap;
            margin: 0 0 15px;
        }

        .setting-box {
            border-top: 1px dashed color-mix(in srgb, var(--c) 30%, transparent);
            padding-top: 12px;
        }
        .setting-item {
            font-size: 13px;
            color: var(--muted);
            margin: 4px 0;
        }
        .setting-item span {
            color: var(--text);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="site-header">
            <h1 class="title">TOH-Zero Role Wiki</h1>
            <nav class="tabs" id="tabs"></nav>
        </header>

        <main id="roles"></main>
    </div>

    <script>
        /*
         ==========================================
         役職データ（ここに追加するだけで増えます）
         ----------------------------------------
         id        : 英数字・ハイフンのみ（タブのリンク先になります）
         name      : 表示名（絵文字も可）
         color     : カードの色
         image     : 画像のパス（省略可）
         description: 説明文（改行可）
         settings  : 設定項目 [ラベル, 値] の配列
         ==========================================
        */
        const ROLES = [
            {
                id: "sheriff",
                name: "🏹 シェリフ",
                color: "#3b82f6",
                image: "img/sheriff.png",
                description: "ペットを撫でることでタスクモードとシェリフモードを切り替えることができます。\nインポスター陣営をキルすることができます。\nニュートラルをキル可能にする設定有。\nクルーメイトをキルすると自殺します。\nタスクモード中はシェリフのキル能力は使用できず、シェリフモードではタスクが行えません。",
                settings: [
                    ["キルクールタイム", "30秒"],
                    ["誤キル時のペナルティ", "あり"]
                ]
            },
            {
                id: "serial-killer",
                name: "🔪 シリアルキラー",
                color: "#ef4444",
                image: "img/serial_killer.png",
                description: "キルクールが他のインポスターに比べて短い反面、変身のクールタイムが明ける前にキルしないと自爆する。",
                settings: [
                    ["キルクールタイム", "20秒"]
                ]
            }
            // ↓ 新しい役職はここに追加（最後の } の後ろに , を付けて貼り付け）
            // {
            //     id: "example",
            //     name: "🛡 役職名",
            //     color: "#22c55e",
            //     image: "img/example.png",
            //     description: "説明文",
            //     settings: [
            //         ["キルクールタイム", "30秒"]
            //     ]
            // }
        ];

        /* ---- 以下は触らなくてOK：データからページを組み立てます ---- */
        const tabs = document.getElementById("tabs");
        const main = document.getElementById("roles");

        ROLES.forEach(role => {
            const a = document.createElement("a");
            a.href = "#" + role.id;
            a.textContent = role.name;
            tabs.appendChild(a);

            const details = document.createElement("details");
            details.className = "role";
            details.id = role.id;
            details.style.setProperty("--c", role.color);

            const summary = document.createElement("summary");
            summary.innerHTML = `<span></span><span class="arrow">▼</span>`;
            summary.firstElementChild.textContent = role.name;
            details.appendChild(summary);

            const content = document.createElement("div");
            content.className = "role-content";

            if (role.image) {
                const imgBox = document.createElement("div");
                imgBox.className = "role-image";
                const img = document.createElement("img");
                img.src = role.image;
                img.alt = role.name + "画像";
                imgBox.appendChild(img);
                content.appendChild(imgBox);
            }

            const desc = document.createElement("p");
            desc.className = "role-description";
            desc.textContent = role.description;
            content.appendChild(desc);

            if (role.settings && role.settings.length) {
                const box = document.createElement("div");
                box.className = "setting-box";
                role.settings.forEach(([label, value]) => {
                    const item = document.createElement("div");
                    item.className = "setting-item";
                    item.append(label + ": ");
                    const v = document.createElement("span");
                    v.textContent = value;
                    item.appendChild(v);
                    box.appendChild(item);
                });
                content.appendChild(box);
            }

            details.appendChild(content);
            main.appendChild(details);
        });
    </script>

</body>
</html>
