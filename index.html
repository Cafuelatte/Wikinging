<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アモアス役職Wiki</title>
<style>
:root {
  --bg: #0b0e14;
  --card: #161b26;
  --card-2: #1c2230;
  --border: #2a3142;
  --text: #ffffff;
  --sub: #c3cad6;
  --muted: #8a93a3;
  --header-h: 56px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 12px); }
body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); }
.container { max-width: 500px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* 画面上部に固定されるヘッダー（左：TOH-Zeroの画像、右：役職Wiki） */
.site-header {
  position: sticky;
  top: 0;
  z-index: 10;
  height: var(--header-h);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}
.site-header img { height: 32px; width: auto; display: block; }
.site-header .wiki-label { font-size: 18px; font-weight: bold; }

/* ページ最上部の中央寄せ大見出し */
.page-title {
  margin: 0;
  padding: 40px 20px 8px;
  font-size: 32px;
  font-weight: bold;
  text-align: center;
}

/* --- 検索・フィルター --- */
.filter-area { padding: 0 20px 16px; }
.search-input {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 14px;
  margin-bottom: 12px;
  outline: none;
}
.search-input:focus { border-color: #3b82f6; }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-btn {
  font-size: 12px;
  font-weight: bold;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.tag-btn.active { color: var(--text); border-color: #3b82f6; background: #1e3a8a; }
.empty-msg { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; display: none; }

main { padding: 0 20px 20px; flex: 1; }
.role { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 16px; overflow: hidden; scroll-margin-top: calc(var(--header-h) + 12px); }
.role summary { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; list-style: none; }
.role summary::-webkit-details-marker { display: none; }
.role summary:hover { background: var(--card-2); }
.role-icon { flex: 0 0 56px; height: 56px; border-radius: 12px; background: #000; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 26px; overflow: hidden; }
.role-icon img { width: 100%; height: 100%; object-fit: contain; }
.role-head { flex: 1; min-width: 0; }
.role-name { margin: 0; font-size: 19px; font-weight: bold; }
.role-en { font-size: 13px; color: var(--muted); margin-top: 2px; }
.arrow { color: var(--muted); font-size: 12px; transition: transform 0.2s ease; }
.role[open] .arrow { transform: rotate(180deg); }
.role-body { padding: 0 18px 20px; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.badge { font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.role-description { font-size: 14px; line-height: 1.8; color: var(--sub); white-space: pre-wrap; margin: 0 0 20px; }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: bold; margin: 0 0 12px; }

/* --- 固有能力カード --- */
.ability { background: var(--card-2); border: 1px solid var(--border); border-radius: 12px; padding: 18px 16px; margin-bottom: 14px; text-align: center; }
.ability-icon { width: 84px; height: 84px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; }
.ability-icon img { max-width: 100%; max-height: 100%; object-fit: contain; }
.ability-name { font-size: 15px; font-weight: bold; margin-bottom: 8px; text-align: left; }
.ability-desc { font-size: 13px; line-height: 1.7; color: var(--muted); white-space: pre-wrap; text-align: left; }

.setting-list { border-left: 3px solid var(--border); padding-left: 14px; margin-left: 4px; }
.setting-item { font-size: 14px; font-weight: bold; padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; }
.setting-item:last-child { border-bottom: none; }
.setting-item span.value { color: var(--c); font-weight: bold; }

/* ページ最下部のGitHubリンク */
.site-footer { padding: 24px 20px 32px; text-align: center; border-top: 1px solid var(--border); }
.github-link {
  display: inline-block;
  padding: 10px 20px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: bold;
}
.github-link:hover { background: var(--card); }
</style>
</head>
<body>
<div class="container">
  <header class="site-header">
    <img src="img/toh-zero.png" alt="TOH-Zero" onerror="this.replaceWith(Object.assign(document.createElement('span'), {className: 'wiki-label', textContent: 'TOH-Zero'}))">
    <span class="wiki-label">役職Wiki</span>
  </header>
  <h1 class="page-title">役職一覧</h1>

  <div class="filter-area">
    <input type="text" class="search-input" id="search" placeholder="役職名で検索">
    <div class="tag-list" id="tagList"></div>
  </div>

  <main id="roles"></main>
  <p class="empty-msg" id="emptyMsg">該当する役職がありません</p>

  <footer class="site-footer">
    <a class="github-link" href="https://github.com/cafuelatte/Wikinging" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>

<script>
/* タグごとの色（新しいタグを追加したらここにも1行足す） */
const TAG_COLORS = {
  "クルーメイト": "#3b82f6",
  "インポスター": "#ff1919",
  "ニュートラル": "#a3a3a3",
  "TownOfHost-Zero": "#6e6e6e"
};

const ROLES = [
  {
    id: "fennec",
    name: "フェネック",
    en: "Fennec",
    color: "#ff1919",
    icon: "img/fennec.png",
    iconEmoji: "🕳",
    badges: ["インポスター","TownOfHost-Zero"],
    description: "専用の穴を作成して移動し、最寄りのプレイヤーを探知できるインポスターです。",
    abilities: [
      {
        name: "穴掘り",
        description: "穴を作成します。",
      },
      {
        name: "穴ネットワーク",
        description: "穴と穴でテレポートします。",
      },
      {
        name: "獲物探知",
        description: "自身から最も近いプレイヤーの方向が\n8方向の矢印で常時表示されます。",
      },
    ],
    settings: [
      ["穴作成クールダウン", "0/180/0.5"],
      ["テレポートクールダウン", "On/Off"],
      ["他人の作成した穴を使用できる", "On/Off"],
      ["インポスターが穴を視認できる", "On/Off"],
      ["インポスター以外が穴を視認できる", "On/Off"],
      ["フェネックが死亡すると穴が消える", "On/Off"],
    ]
  }
  // 新しい役職は、この下に ",{ ... }" の形で追加してください
];

const main = document.getElementById("roles");
const tagList = document.getElementById("tagList");
const searchInput = document.getElementById("search");
const emptyMsg = document.getElementById("emptyMsg");

let activeTag = null;

/* 全役職のバッジから重複なしのタグ一覧を作る */
const allTags = [...new Set(ROLES.flatMap(r => r.badges || []))];

function makeIcon(role) {
  const box = document.createElement("div");
  box.className = "role-icon";
  if (role.icon) {
    const img = document.createElement("img");
    img.src = role.icon;
    img.alt = role.name;
    img.onerror = () => { img.remove(); box.textContent = role.iconEmoji || ""; };
    box.appendChild(img);
  } else {
    box.textContent = role.iconEmoji || "";
  }
  return box;
}

function buildRole(role) {
  const details = document.createElement("details");
  details.className = "role";
  details.id = role.id;
  details.style.setProperty("--c", role.color);

  const summary = document.createElement("summary");
  summary.appendChild(makeIcon(role));

  const head = document.createElement("div");
  head.className = "role-head";
  const name = document.createElement("p");
  name.className = "role-name";
  name.style.color = role.color;
  name.textContent = role.name;
  head.appendChild(name);
  if (role.en) {
    const en = document.createElement("div");
    en.className = "role-en";
    en.textContent = "/ " + role.en;
    head.appendChild(en);
  }
  summary.appendChild(head);

  const arrow = document.createElement("span");
  arrow.className = "arrow";
  arrow.textContent = "▼";
  summary.appendChild(arrow);
  details.appendChild(summary);

  const body = document.createElement("div");
  body.className = "role-body";

  if (role.badges && role.badges.length) {
    const badges = document.createElement("div");
    badges.className = "badges";
    role.badges.forEach(text => {
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = text;
      b.style.setProperty("--c", TAG_COLORS[text] || "#8a93a3");
      badges.appendChild(b);
    });
    body.appendChild(badges);
  }

  const desc = document.createElement("p");
  desc.className = "role-description";
  desc.textContent = role.description;
  body.appendChild(desc);

  if (role.abilities && role.abilities.length) {
    const t = document.createElement("h3");
    t.className = "section-title";
    t.textContent = "能力";
    body.appendChild(t);
    role.abilities.forEach(ab => {
      const card = document.createElement("div");
      card.className = "ability";
      if (ab.image) {
        const iconBox = document.createElement("div");
        iconBox.className = "ability-icon";
        const img = document.createElement("img");
        img.src = ab.image;
        img.alt = ab.name;
        img.onerror = () => iconBox.remove();
        iconBox.appendChild(img);
        card.appendChild(iconBox);
      }
      const abName = document.createElement("div");
      abName.className = "ability-name";
      abName.textContent = ab.name;
      card.appendChild(abName);
      const abDesc = document.createElement("div");
      abDesc.className = "ability-desc";
      abDesc.textContent = ab.description;
      card.appendChild(abDesc);
      body.appendChild(card);
    });
  }

  if (role.settings && role.settings.length) {
    const t = document.createElement("h3");
    t.className = "section-title";
    t.textContent = "設定";
    body.appendChild(t);
    const list = document.createElement("div");
    list.className = "setting-list";
    role.settings.forEach(([label, value]) => {
      const item = document.createElement("div");
      item.className = "setting-item";
      const l = document.createElement("span");
      l.textContent = label;
      const v = document.createElement("span");
      v.className = "value";
      v.textContent = value;
      item.append(l, v);
      list.appendChild(item);
    });
    body.appendChild(list);
  }

  details.appendChild(body);
  return details;
}

const cards = ROLES.map(role => ({ role, el: buildRole(role) }));
cards.forEach(c => main.appendChild(c.el));

allTags.forEach(tag => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "tag-btn";
  btn.textContent = tag;
  btn.dataset.tag = tag;
  btn.addEventListener("click", () => {
    activeTag = activeTag === tag ? null : tag;
    refreshTagButtons();
    applyFilter();
  });
  tagList.appendChild(btn);
});

function refreshTagButtons() {
  tagList.querySelectorAll(".tag-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tag === activeTag);
  });
}

function applyFilter() {
  const q = searchInput.value.trim().toLowerCase();
  let shown = 0;
  cards.forEach(({ role, el }) => {
    const matchTag = !activeTag || (role.badges || []).includes(activeTag);
    const matchText = !q ||
      role.name.toLowerCase().includes(q) ||
      (role.en || "").toLowerCase().includes(q);
    const visible = matchTag && matchText;
    el.style.display = visible ? "" : "none";
    if (visible) shown++;
  });
  emptyMsg.style.display = shown === 0 ? "block" : "none";
}

searchInput.addEventListener("input", applyFilter);
</script>
</body>
</html>
