<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アモアス役職Wiki</title>
    <style>
        /* --- 基本設定（黒背景に白文字） --- */
        body {
            font-family: sans-serif;
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- ヘッダー --- */
        .header {
            font-size: 20px;
            font-weight: bold;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        /* --- 各役職の枠 --- */
        .role-container {
            border-bottom: 1px solid #222;
        }

        /* --- タップする部分 --- */
        .role-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- 開く詳細部分 --- */
        .role-content {
            display: none;
            padding-bottom: 20px;
        }
        .open .role-content {
            display: block;
        }

        /* --- 画像のサイズ --- */
        .role-image {
            width: 100%;
            max-height: 200px;
            margin-bottom: 15px;
        }
        .role-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- 説明文 --- */
        .role-description {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        /* --- 設定項目 --- */
        .setting-item {
            font-size: 13px;
            color: #888;
            margin: 4px 0;
        }
        .setting-item span {
            color: #fff;
        }

        /* ==========================================
           🎨 役職ごとの色（名前と設定のタイトルのみ変更）
        ========================================== */
        
        /* 青：シェリフ */
        .role-container.sheriff .role-trigger { color: #3b82f6; }
        
        /* 赤：シリアルキラー */
        .role-container.serial-killer .role-trigger { color: #ef4444; }

    </style>
</head>
<body>

    <div class="header">TOH-Zero Role Wiki</div>

    <!-- 役職1: シェリフ -->
    <div class="role-container sheriff">
        <div class="role-trigger">
            <span>🏹 シェリフ</span>
            <span>▼</span>
        </div>
        <div class="role-content">
            <!-- 🖼️ 画像（不要ならこの3行を丸ごと消してOK） -->
            <div class="role-image">
                <img src="img/sheriff.png" alt="">
            </div>
            <div class="role-description">ペットを撫でることでタスクモードとシェリフモードを切り替えることができます。
インポスター陣営をキルすることができます。
ニュートラルをキル可能にする設定有。
クルーメイトをキルすると自殺します。
タスクモード中はシェリフのキル能力は使用できず、シェリフモードではタスクが行えません。</div>
            <div class="setting-item">キルクールタイム: <span>30秒</span></div>
            <div class="setting-item">誤キル時のペナルティ: <span>あり</span></div>
        </div>
    </div>

    <!-- 役職2: シリアルキラー -->
    <div class="role-container serial-killer">
        <div class="role-trigger">
            <span>🔪 シリアルキラー</span>
            <span>▼</span>
        </div>
        <div class="role-content">
            <!-- 🖼️ 画像 -->
            <div class="role-image">
                <img src="img/serial_killer.png" alt="">
            </div>
            <div class="role-description">キルクールが他のインポスターに比べて短い反面、変身のクールタイムが明ける前にキルしないと自爆する。</div>
            <div class="setting-item">キルクールタイム: <span>20秒</span></div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.role-trigger').forEach(trigger => {
            trigger.addEventListener('click', () => {
                trigger.parentElement.classList.toggle('open');
            });
        });
    </script>

</body>
</html>
