<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アモアス役職Wiki</title>
    <style>
        :root {
            --bg: #000000;
            --card: #050505;
            --text: #ffffff;
            --sub: #dddddd;
            --muted: #888888;
            --line: #222222;
            --bar-h: 48px;
        }

        * { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--bar-h) + 10px);
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- ページ最上部のタイトル（スクロールで消える） --- */
        .title {
            margin: 0;
            padding: 20px;
            font-size: 22px;
            border-bottom: 2px solid var(--line);
        }

        /* --- 常に最上部に固定されるタブバー --- */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #000000;
            border-bottom: 2px solid var(--line);
            display: flex;
            height: var(--bar-h);
        }
        .tabs a {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .tabs a:hover { background: #111111; color: var(--text); }
        .tabs a:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }

        /* --- 本文 --- */
        main {
            padding: 20px;
        }

        /* --- 役職カード --- */
        .role {
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            background: var(--card);
            border: 2px solid var(--c);
            scroll-margin-top: calc(var(--bar-h) + 10px);
        }
        .role.sheriff { --c: #3b82f6; }
        .role.serial-killer { --c: #ef4444; }

        .role summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            color: var(--c);
            cursor: pointer;
            list-style: none;
        }
        .role summary::-webkit-details-marker { display: none; }
        .role summary:hover { background: #111111; }
        .role summary:focus-visible { outline: 2px solid var(--c); outline-offset: -2px; }

        .arrow { transition: transform 0.2s ease; }
        .role[open] .arrow { transform: rotate(180deg); }

        .role-content {
            padding: 0 20px 20px;
        }

        .role-image {
            margin-bottom: 15px;
            border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
            border-radius: 8px;
            overflow: hidden;
        }
        .role-image img {
            display: block;
            width: 100%;
            max-height: 180px;
            object-fit: contain;
        }

        .role-description {
            font-size: 14px;
            line-height: 1.6;
            color: var(--sub);
            white-space: pre-wrap;
            margin: 0 0 15px;
        }

        .setting-box {
            border-top: 1px dashed color-mix(in srgb, var(--c) 30%, transparent);
            padding-top: 12px;
        }
        .setting-item {
            font-size: 13px;
            color: var(--muted);
            margin: 4px 0;
        }
        .setting-item span {
            color: var(--text);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">TOH-Zero Role Wiki</h1>

        <nav class="tabs">
            <a href="#sheriff">🏹 シェリフ</a>
            <a href="#serial-killer">🔪 シリアルキラー</a>
        </nav>

        <main>
            <details class="role sheriff" id="sheriff">
                <summary>
                    <span>🏹 シェリフ</span>
                    <span class="arrow">▼</span>
                </summary>
                <div class="role-content">
                    <div class="role-image">
                        <img src="img/sheriff.png" alt="シェリフ画像">
                    </div>
                    <p class="role-description">ペットを撫でることでタスクモードとシェリフモードを切り替えることができます。
インポスター陣営をキルすることができます。
ニュートラルをキル可能にする設定有。
クルーメイトをキルすると自殺します。
タスクモード中はシェリフのキル能力は使用できず、シェリフモードではタスクが行えません。</p>
                    <div class="setting-box">
                        <div class="setting-item">キルクールタイム: <span>30秒</span></div>
                        <div class="setting-item">誤キル時のペナルティ: <span>あり</span></div>
                    </div>
                </div>
            </details>

            <details class="role serial-killer" id="serial-killer">
                <summary>
                    <span>🔪 シリアルキラー</span>
                    <span class="arrow">▼</span>
                </summary>
                <div class="role-content">
                    <div class="role-image">
                        <img src="img/serial_killer.png" alt="シリアルキラー画像">
                    </div>
                    <p class="role-description">キルクールが他のインポスターに比べて短い反面、変身のクールタイムが明ける前にキルしないと自爆する。</p>
                    <div class="setting-box">
                        <div class="setting-item">キルクールタイム: <span>20秒</span></div>
                    </div>
                </div>
            </details>
        </main>
    </div>

</body>
</html>
