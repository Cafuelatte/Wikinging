<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アモアス役職Wiki</title>
    <style>
        /* --- 基本設定（黒背景に白文字） --- */
        body {
            font-family: sans-serif;
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* --- ヘッダー --- */
        .header {
            font-size: 20px;
            font-weight: bold;
            padding-bottom: 15px;
            border-bottom: 2px solid #222;
            margin-bottom: 20px;
        }

        /* --- 📦 役職ごとの外枠（デフォルトはグレー） --- */
        .role-container {
            border: 2px solid #222;
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            background-color: #050505;
        }

        /* --- タップするヘッダー部分 --- */
        .role-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        /* --- 開く詳細部分 --- */
        .role-content {
            display: none;
            padding: 0 20px 20px 20px;
        }
        .open .role-content {
            display: block;
        }

        /* --- 🖼️ 画像のサイズと枠 --- */
        .role-image {
            width: 100%;
            max-height: 180px;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #222;
        }
        .role-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- 説明文 --- */
        .role-description {
            font-size: 14px;
            line-height: 1.6;
            color: #dddddd;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        /* --- ⚙️ 設定項目のグループ枠 --- */
        .setting-box {
            border-top: 1px dashed #222;
            padding-top: 12px;
        }
        .setting-item {
            font-size: 13px;
            color: #888888;
            margin: 4px 0;
        }
        .setting-item span {
            color: #ffffff;
            font-weight: bold;
        }

        /* ==========================================
           🎨 役職ごとの色（枠線・文字・区切り線を一括変更）
        ========================================== */
        
        /* 🏹 青：シェリフ */
        .role-container.sheriff { border-color: #3b82f6; }
        .role-container.sheriff .role-trigger { color: #3b82f6; }
        .role-container.sheriff .role-image { border-color: rgba(59, 130, 246, 0.3); }
        .role-container.sheriff .setting-box { border-top-color: rgba(59, 130, 246, 0.3); }
        
        /* 🔪 赤：シリアルキラー */
        .role-container.serial-killer { border-color: #ef4444; }
        .role-container.serial-killer .role-trigger { color: #ef4444; }
        .role-container.serial-killer .role-image { border-color: rgba(239, 68, 68, 0.3); }
        .role-container.serial-killer .setting-box { border-top-color: rgba(239, 68, 68, 0.3); }

    </style>
</head>
<body>

    <div class="header">TOH-Zero Role Wiki</div>

    <!-- 役職1: シェリフ -->
    <div class="role-container sheriff">
        <div class="role-trigger">
            <span>🏹 シェリフ</span>
            <span>▼</span>
        </div>
        <div class="role-content">
            <!-- 🖼️ 画像（imgフォルダ内の画像を指定） -->
            <div class="role-image">
                <img src="img/sheriff.png" alt="シェリフ画像">
            </div>
            <div class="role-description">ペットを撫でることでタスクモードとシェリフモードを切り替えることができます。
インポスター陣営をキルすることができます。
ニュートラルをキル可能にする設定有。
クルーメイトをキルすると自殺します。
タスクモード中はシェリフのキル能力は使用できず、シェリフモードではタスクが行えません。</div>
            
            <div class="setting-box">
                <div class="setting-item">キルクールタイム: <span>30秒</span></div>
                <div class="setting-item">誤キル時のペナルティ: <span>あり</span></div>
            </div>
        </div>
    </div>

    <!-- 役職2: シリアルキラー -->
    <div class="role-container serial-killer">
        <div class="role-trigger">
            <span>🔪 シリアルキラー</span>
            <span>▼</span>
        </div>
        <div class="role-content">
            <!-- 🖼️ 画像 -->
            <div class="role-image">
                <img src="img/serial_killer.png" alt="シリアルキラー画像">
            </div>
            <div class="role-description">キルクールが他のインポスターに比べて短い反面、変身のクールタイムが明ける前にキルしないと自爆する。</div>
            
            <div class="setting-box">
                <div class="setting-item">キルクールタイム: <span>20秒</span></div>
            </div>
        </div>
    </div>

    <!-- JavaScript（開閉の動き） -->
    <script>
        document.querySelectorAll('.role-trigger').forEach(trigger => {
            trigger.addEventListener('click', () => {
                trigger.parentElement.classList.toggle('open');
            });
        });
    </script>

</body>
</html>
